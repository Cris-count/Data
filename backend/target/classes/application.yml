server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: data-salesanalytics
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/data_sales}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  seed-demo-data: ${SEED_DEMO_DATA:true}
