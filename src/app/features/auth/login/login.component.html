<section class="auth-page">
  <div class="auth-panel">
    <img class="auth-logo" src="/logo-data.png" alt="Data Sales Analytics">
    <p class="eyebrow">Pipeline comercial</p>
    <h1>Data Sales Analytics</h1>
    <p class="muted">Ingresa para consultar ventas, metricas y predicciones heuristicas del proximo mes.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <label>Correo
        <input type="email" formControlName="email" autocomplete="email">
      </label>
      <label>Contrasena
        <input type="password" formControlName="password" autocomplete="current-password">
      </label>
      @if (error()) { <p class="error">{{ error() }}</p> }
      <button type="submit" [disabled]="loading()">{{ loading() ? 'Validando...' : 'Iniciar sesion' }}</button>
    </form>

    <p class="muted">No tienes cuenta? <a routerLink="/register">Crear usuario</a></p>
  </div>
</section>
