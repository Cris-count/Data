<section class="auth-page">
  <div class="auth-panel">
    <img class="auth-logo" src="/logo-data.png" alt="Data Sales Analytics">
    <p class="eyebrow">Nuevo usuario</p>
    <h1>Crear cuenta</h1>
    <p class="muted">El rol se asigna automaticamente como USER y la contrasena se cifra en backend.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <label>Nombre
        <input type="text" formControlName="name" autocomplete="name">
      </label>
      <label>Correo
        <input type="email" formControlName="email" autocomplete="email">
      </label>
      <label>Contrasena
        <input type="password" formControlName="password" autocomplete="new-password">
      </label>
      @if (error()) { <p class="error">{{ error() }}</p> }
      <button type="submit" [disabled]="loading()">{{ loading() ? 'Creando...' : 'Registrarme' }}</button>
    </form>

    <p class="muted">Ya tienes cuenta? <a routerLink="/login">Iniciar sesion</a></p>
  </div>
</section>
