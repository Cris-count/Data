<div class="shell" [class.public-shell]="isPublicRoute() || !auth.currentUser()">
  @if (auth.currentUser() && !isPublicRoute()) {
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/logo-data.png" alt="Data Sales Analytics">
        <div>
          <strong>Data</strong>
          <small>Sales Analytics</small>
        </div>
      </div>
      <nav>
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/sales" routerLinkActive="active">Ventas</a>
        <a routerLink="/analytics" routerLinkActive="active">Analitica</a>
        <a routerLink="/predictions" routerLinkActive="active">Predicciones</a>
      </nav>
      <button type="button" class="ghost" (click)="auth.logout()">Cerrar sesion</button>
    </aside>
  }
  <main class="content" [class.auth-content]="isPublicRoute() || !auth.currentUser()">
    <router-outlet />
  </main>
</div>
