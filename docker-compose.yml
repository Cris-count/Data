services:
  postgres:
    image: postgres:16-alpine
    container_name: data-sales-postgres
    environment:
      POSTGRES_DB: data_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_sales"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: data-sales-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/data_sales
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: change-this-development-secret-change-this-development-secret
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"
    networks:
      - data-network

volumes:
  postgres-data:

networks:
  data-network:
    driver: bridge
